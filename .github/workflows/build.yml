name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install SDL2
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev

      - name: Strict C89 conformance
        run: |
          sdl=$(pkg-config --cflags sdl2 | sed 's/-I/-isystem /g')
          for f in ff_*.c; do
            # ff_platform_win32.c and ff_audio_win32.c include windows.h, which
            # this host has no copy of, and the Windows SDK headers are not C89
            # anyway.  The windows-native job below compiles them for real.
            case "$f" in *_win32.c) continue;; esac
            gcc -std=c89 -pedantic-errors -Wall -Wextra $sdl -c "$f" -o /dev/null
          done

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel

      - name: Headless frame dump
        run: |
          cd build
          set +e
          SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy \
            timeout 60 ./ffrace 1 --dump=frame.raw --dump-frame=60 | tee frame.txt
          rc=${PIPESTATUS[0]}
          set -e
          echo "ffrace exit code: $rc"
          test "$rc" = 0
          expected=$((240 * 320 * 2))
          actual=$(stat -c%s frame.raw)
          test "$actual" = "$expected" || {
            echo "frame.raw is $actual bytes, expected $expected"
            exit 1
          }
          grep -q 'screen=0 ingame=0' frame.txt || {
            echo "the dump did not capture the main menu:"
            cat frame.txt
            exit 1
          }

      # Touch_Draw paints the on-screen pad straight into the SDL renderer after
      # the 240x320 texture is copied, so --dump never contains it. This step
      # exercises the touch init / pad geometry / resizable-window path only.
      - name: Headless run with the touch overlay enabled
        run: |
          cd build
          set +e
          SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy FFRACE_TOUCH=1 \
            timeout 60 ./ffrace 1 --dump=touch.raw --dump-frame=60
          rc=$?
          set -e
          echo "ffrace exit code: $rc"
          test "$rc" = 0
          expected=$((240 * 320 * 2))
          actual=$(stat -c%s touch.raw)
          test "$actual" = "$expected" || {
            echo "touch.raw is $actual bytes, expected $expected"
            exit 1
          }

      - name: Headless race start
        run: |
          cd build
          set +e
          SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy \
            timeout 60 ./ffrace 1 --activate=0,0,4 \
              --dump=race.raw --dump-frame=200 | tee race.txt
          rc=${PIPESTATUS[0]}
          set -e
          echo "ffrace exit code: $rc"
          test "$rc" = 0
          test "$(stat -c%s race.raw)" = "$((240 * 320 * 2))"
          grep -q 'ingame=1' race.txt || {
            echo "the dump did not capture a running race:"
            cat race.txt
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: ffrace-linux-${{ matrix.arch }}
          path: |
            build/ffrace
            build/BITMAP
            build/Sounds
            build/Musics

  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: x86
            platform: Win32
            triplet: x86-windows
          - runner: windows-11-arm
            arch: arm64
            platform: ARM64
            triplet: arm64-windows
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install SDL2
        run: vcpkg install sdl2:${{ matrix.triplet }}

      - name: Build
        run: |
          cmake -S . -B build -A ${{ matrix.platform }} `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}
          cmake --build build --config Release

      - name: Headless frame dump
        run: |
          cd build/Release
          $env:SDL_VIDEODRIVER = 'dummy'
          $env:SDL_AUDIODRIVER = 'dummy'
          $p = Start-Process .\ffrace.exe -ArgumentList '1','--dump=frame.raw','--dump-frame=60' -Wait -PassThru
          "ffrace exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { exit 1 }
          $expected = 240 * 320 * 2
          $actual = (Get-Item frame.raw).Length
          if ($actual -ne $expected) {
            "frame.raw is $actual bytes, expected $expected"
            exit 1
          }

      # The same sources with FFRACE_BACKEND=win32: GDI and waveOut, no SDL2.
      # Build only - the runner has no interactive desktop to present to.
      - name: Build the native Win32 backend
        run: |
          cmake -S . -B build-native -A ${{ matrix.platform }} `
            -DFFRACE_BACKEND=win32
          cmake --build build-native --config Release

      - uses: actions/upload-artifact@v4
        with:
          name: ffrace-windows-native-${{ matrix.arch }}
          path: |
            build-native/Release/ffrace.exe
            build-native/Release/BITMAP
            build-native/Release/Sounds
            build-native/Release/Musics

      - uses: actions/upload-artifact@v4
        with:
          name: ffrace-windows-${{ matrix.arch }}
          path: |
            build/Release/ffrace.exe
            build/Release/SDL2.dll
            build/Release/BITMAP
            build/Release/Sounds
            build/Release/Musics

  windows-native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install mingw-w64 and Wine
        run: |
          # The wine command comes from the "wine" package; "wine64" ships no
          # binaries of its own.  Creating a prefix also runs the 32-bit
          # rundll32 over wine.inf, so the i386 side has to be there or the
          # prefix is left half-built and every later run fails.
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 wine wine32:i386 wine64 xvfb

      - name: Build
        run: MINGW_PREFIX=x86_64-w64-mingw32 sh tools/build_win32.sh

      - name: Headless frame dump under Wine
        run: |
          cd build-win32
          export WINEPREFIX="$PWD/.wine"
          export WINEARCH=win64
          # Keep err: messages; only the fixme noise is worth hiding here.
          export WINEDEBUG=fixme-all
          # Build the prefix in its own step and wait for the server to exit,
          # so a first-run failure is reported as such instead of surfacing as
          # a confusing exit code from the game.
          xvfb-run -a wineboot --init
          wineserver -w
          # Platform_Init really does call CreateWindowExW, GetDC and
          # SetForegroundWindow, so hand it an X server rather than trusting
          # Wine's null display driver to fake all three.
          set +e
          xvfb-run -a timeout 180 wine ffrace.exe 1 --dump=frame.raw --dump-frame=60
          rc=$?
          set -e
          echo "ffrace exit code: $rc"
          test "$rc" = 0
          expected=$((240 * 320 * 2))
          actual=$(stat -c%s frame.raw)
          test "$actual" = "$expected" || {
            echo "frame.raw is $actual bytes, expected $expected"
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: ffrace-windows-native-mingw
          path: |
            build-win32/ffrace.exe
            build-win32/BITMAP
            build-win32/Sounds
            build-win32/Musics

  wince:
    strategy:
      fail-fast: false
      matrix:
        arch: [arm, i386]
    runs-on: ubuntu-24.04
    # Prebuilt public CeGCC 9.3.0 for arm-mingw32ce / i386-mingw32ce; no cegcc
    # package exists in Debian or Ubuntu, and building it here would dominate
    # the run.  https://github.com/enlyze/ghcr-windows-ce-build-environment
    container: ghcr.io/enlyze/windows-ce-build-environment-${{ matrix.arch }}:latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          CEGCC=/opt/cegcc-${{ matrix.arch }} \
            TARGET=${{ matrix.arch }}-mingw32ce \
            sh tools/build_wince.sh

      # A runner has no Windows CE host and no CE emulator, so this binary
      # cannot be executed here the way the Wine job executes the Win32 one.
      # What is checkable is that it came out as a CE PE for the requested
      # architecture and that every import resolves to coredll.dll - the one
      # library a device actually provides.  aygshell is deliberately absent:
      # ff_platform_win32.c resolves SHFullScreen with LoadLibrary so images
      # without aygshell still run.
      - name: Inspect the binary
        run: |
          bin=/opt/cegcc-${{ matrix.arch }}/bin
          ls "$bin"
          objdump=$bin/${{ matrix.arch }}-mingw32ce-objdump
          "$objdump" -f build-wince/ffrace.exe | tee format.txt
          "$objdump" -p build-wince/ffrace.exe > headers.txt
          cat headers.txt
          grep -qi '${{ matrix.arch }}' format.txt
          grep -i 'DLL Name' headers.txt > dlls.txt || {
            echo "objdump printed no import table"
            exit 1
          }
          grep -qi 'coredll' dlls.txt
          for bad in kernel32 user32 gdi32 winmm aygshell; do
            if grep -qi "$bad" dlls.txt; then
              echo "unexpected import $bad - a device only provides coredll"
              exit 1
            fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: ffrace-wince-${{ matrix.arch }}
          path: |
            build-wince/ffrace.exe
            build-wince/BITMAP
            build-wince/Sounds
            build-wince/Musics

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Assemble the Gradle project
        run: sh tools/android_prepare.sh

      - name: Build APK
        working-directory: build-android
        run: ./gradlew --no-daemon assembleDebug

      - name: Check the APK payload
        run: |
          apk=$(ls build-android/app/build/outputs/apk/debug/*.apk)
          echo "apk: $apk"
          unzip -l "$apk" > apk.txt
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            for so in libmain.so libSDL2.so; do
              grep -q "lib/$abi/$so" apk.txt || {
                echo "missing lib/$abi/$so"
                exit 1
              }
            done
          done
          for asset in BITMAP/330.bmp Sounds/sblam.wav Musics/mainmenu.tkm; do
            grep -q "assets/$asset" apk.txt || {
              echo "missing assets/$asset"
              exit 1
            }
          done

      - uses: actions/upload-artifact@v4
        with:
          name: ffrace-android
          path: build-android/app/build/outputs/apk/debug/*.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, windows-native, wince, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package every configuration
        run: |
          ver=${GITHUB_REF_NAME#v}
          mkdir -p dist
          for arch in x86_64 arm64; do
            d=artifacts/ffrace-linux-$arch
            chmod +x "$d/ffrace"
            tar --mode=0755 -czf "dist/ffrace-$ver-linux-$arch.tar.gz" -C "$d" .
          done
          for arch in x86 arm64; do
            (cd "artifacts/ffrace-windows-$arch" &&
             zip -qr "$GITHUB_WORKSPACE/dist/ffrace-$ver-windows-$arch.zip" .)
            (cd "artifacts/ffrace-windows-native-$arch" &&
             zip -qr "$GITHUB_WORKSPACE/dist/ffrace-$ver-windows-native-$arch.zip" .)
          done
          (cd artifacts/ffrace-windows-native-mingw &&
           zip -qr "$GITHUB_WORKSPACE/dist/ffrace-$ver-windows-native-x86_64.zip" .)
          for arch in arm i386; do
            (cd "artifacts/ffrace-wince-$arch" &&
             zip -qr "$GITHUB_WORKSPACE/dist/ffrace-$ver-wince-$arch.zip" .)
          done
          cp artifacts/ffrace-android/*.apk "dist/ffrace-$ver-android.apk"
          ls -l dist

      - name: Write the release notes
        run: |
          cat > notes.md <<'EOF'
          Порт FFRace (Fast Future Race) на C89 + SDL2.

          | Файл | Платформа |
          |---|---|
          | `*-android.apk` | Android 5.0+, universal (armeabi-v7a, arm64-v8a, x86, x86_64), экранное управление |
          | `*-windows-x86.zip` | Windows x86 |
          | `*-windows-arm64.zip` | Windows ARM64 |
          | `*-windows-native-x86.zip` | Windows x86, нативный бэкенд (GDI + waveOut, без SDL2) |
          | `*-windows-native-arm64.zip` | Windows ARM64, нативный бэкенд |
          | `*-windows-native-x86_64.zip` | Windows x64, нативный бэкенд, собран mingw-w64 |
          | `*-wince-arm.zip` | Windows CE / Pocket PC / Windows Mobile, ARM |
          | `*-wince-i386.zip` | Windows CE, x86 (эмулятор устройства, промышленные панели) |
          | `*-linux-x86_64.tar.gz` | Linux x86_64 |
          | `*-linux-arm64.tar.gz` | Linux ARM64 |

          Ассеты уложены рядом с исполняемым файлом, распаковывать целиком.
          На Linux нужен установленный SDL2 (`libsdl2-2.0-0`), в остальных сборках SDL2 лежит внутри.
          Нативным сборкам SDL2 не нужен вообще: кадр идёт через GDI, звук через waveOut.
          Сборки для Windows CE собраны cegcc 9.3.0 и из зависимостей требуют только
          `coredll.dll`; каталог распаковывается на устройство целиком, например в
          `\Program Files\FFRace`. На устройстве они не запускались - проверено только то,
          что это корректный CE PE нужной архитектуры.
          EOF

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "FFRace port $GITHUB_REF_NAME" \
            --notes-file notes.md
